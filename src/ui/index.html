<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prism Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/icon.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="backdrop"></div>
<div id="app">
  <header id="titlebar">
    <div id="brand"><svg viewBox="0 0 64 64" width="22" height="22" aria-hidden="true"><path d="M12 10 12 54 44 32Z" fill="#fff" fill-opacity=".22" stroke="#dbe3ff" stroke-width="4" stroke-linejoin="round"/><path d="M44 32 64 19V26Z" fill="#ff3a5c"/><path d="M44 32 64 26V33Z" fill="#ffc400"/><path d="M44 32 64 33V40Z" fill="#2ee86b"/><path d="M44 32 64 40V47Z" fill="#19c3ff"/><path d="M44 32 64 47V54Z" fill="#a24dff"/></svg></div>
    <nav id="menubar" aria-label="Menu"></nav>
    <div id="wincontrols" hidden>
      <button id="wc-min" type="button" title="Minimise" aria-label="Minimise"></button>
      <button id="wc-max" type="button" title="Maximise" aria-label="Maximise"></button>
      <button id="wc-close" type="button" title="Close" aria-label="Close"></button>
    </div>
  </header>

  <section id="transport">
    <div id="tp-left">
      <div class="btn-group">
        <button id="b-prev" class="icon-btn" title="Previous" aria-label="Previous"></button>
        <button id="b-play" class="icon-btn primary" title="Play / Pause" aria-label="Play"></button>
        <button id="b-next" class="icon-btn" title="Next" aria-label="Next"></button>
        <button id="b-stop" class="icon-btn" title="Stop" aria-label="Stop"></button>
      </div>
      <div id="np-line"><span id="np-line-title">Nothing playing</span><span id="np-line-artist"></span></div>
    </div>
    <div id="tp-mid">
      <div id="seek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
        <div class="seek-track"><div class="seek-buf"></div><div class="seek-fill"></div><div class="seek-thumb"></div></div>
      </div>
      <div id="time">0:00 / 0:00</div>
    </div>
    <div id="tp-right">
      <button id="b-order" class="icon-btn wide" title="Playback order"></button>
      <button id="b-lyrics" class="icon-btn" title="Lyrics" aria-label="Lyrics" aria-pressed="false"></button>
      <button id="b-full" class="icon-btn" title="Fullscreen lyrics" aria-label="Fullscreen"></button>
      <div id="vol">
        <button id="b-mute" class="icon-btn" aria-label="Mute"></button>
        <div id="vol-slider" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100"><div class="seek-track"><div class="seek-fill"></div><div class="seek-thumb"></div></div></div>
      </div>
    </div>
  </section>

  <main id="main">
    <aside id="lib" class="panel">
      <div class="lib-top">
        <select id="lib-view" aria-label="Library view"></select>
        <div class="search">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="lib-filter" type="text" placeholder="Filter" spellcheck="false" autocomplete="off">
          <button id="lib-clear" class="icon-btn tiny" aria-label="Clear filter" hidden>×</button>
        </div>
      </div>
      <div id="lib-list" class="vlist" tabindex="0"></div>
    </aside>
    <div class="splitter" id="split-left" role="separator" aria-orientation="vertical"></div>

    <section id="pl" class="panel">
      <div id="tabs" role="tablist"></div>
      <div id="pl-head" class="cols"><div class="c-num" data-sort="order" title="Sort by artist / album / track">#</div><div class="c-title" data-sort="title">Title / track artist</div><div class="c-album" data-sort="album">Album</div><div class="c-time" data-sort="duration">Time</div></div>
      <div id="pl-list" class="vlist" tabindex="0"></div>
      <div id="pl-foot"></div>
    </section>

    <div class="splitter" id="split-right" role="separator" aria-orientation="vertical"></div>
    <aside id="side" class="panel">
      <div id="cover-wrap"><img id="cover" alt="" draggable="false"><div id="cover-ph"></div><div id="cover-shade"></div><div id="cover-lyrics"></div><button id="cover-lyr-btn" class="pill-btn" type="button" title="Show lyrics on the cover (L)" aria-pressed="false"></button></div>
      <div id="np-meta"><div id="np-title"></div><div id="np-artist"></div><div id="np-album"></div></div>
      <div id="props"></div>
    </aside>

    <section id="viz" aria-label="Visualisers (right-click a panel for options)"></section>
  </main>


  <footer id="status">
    <span id="st-tech"></span><span id="st-out"></span><span id="st-pos"></span><span id="st-scrobble"></span><span id="st-lib"></span>
  </footer>
</div>
<div id="fs" hidden>
  <div class="fs-bg"></div><div class="fs-scrim"></div>
  <div class="fs-top">
    <img id="fs-cover" alt="" draggable="false">
    <div class="fs-meta"><div id="fs-title"></div><div id="fs-artist"></div><div id="fs-album"></div></div>
    <button id="fs-close" class="icon-btn" type="button" title="Exit fullscreen (Esc)" aria-label="Exit fullscreen"></button>
  </div>
  <div id="fs-lyrics"></div>
  <div class="fs-bottom">
    <div class="btn-group"><button id="fs-prev" class="icon-btn" type="button" aria-label="Previous"></button><button id="fs-play" class="icon-btn primary" type="button" aria-label="Play / pause"></button><button id="fs-next" class="icon-btn" type="button" aria-label="Next"></button></div>
    <span id="fs-time">0:00 / 0:00</span>
    <div id="fs-seek" role="slider" tabindex="0" aria-label="Seek"><div class="seek-track"><div class="seek-fill"></div><div class="seek-thumb"></div></div></div>
  </div>
</div>
<div id="overlay"></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
