name: Build Prism (Windows)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# needed so the workflow can publish a GitHub Release
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Prism uses ffmpeg to decode everything the browser engine cannot play (DSD, ALAC, WavPack, APE, WMA, TTA, AIFF ...).
      - name: Download ffmpeg
        shell: pwsh
        run: |
          $urls = @(
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip',
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          )
          $ok = $false
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile ffmpeg.zip -UserAgent 'Mozilla/5.0'
              if ((Get-Item ffmpeg.zip).Length -gt 5000000) { Write-Host "Using $u"; $ok = $true; break }
            } catch { Write-Host "Could not download $u : $_" }
          }
          if (-not $ok) { throw 'Could not download ffmpeg' }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          $ff = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $fp = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ff -or -not $fp) { throw 'ffmpeg.exe / ffprobe.exe not found in the download' }
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          Copy-Item $ff.FullName vendor/ffmpeg/ffmpeg.exe
          Copy-Item $fp.FullName vendor/ffmpeg/ffprobe.exe

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Native audio helper: WASAPI exclusive / shared output (one small C file).
      - name: Build the native audio helper (WASAPI)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor/prism-audio | Out-Null
          $out = 'vendor/prism-audio/prism-audio.exe'
          python -m pip install --quiet ziglang
          python -m ziglang cc -target x86_64-windows-gnu -O2 -o $out native/prism-audio.c -lole32 -loleaut32 -luuid -lavrt -lm
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) {
            Write-Host 'Zig build failed, trying the MinGW gcc that ships with the runner'
            gcc -O2 -o $out native/prism-audio.c -lole32 -loleaut32 -luuid -lavrt -lm
          }
          if (-not (Test-Path $out)) { throw 'prism-audio.exe was not built' }
          Get-Item $out | Select-Object Name, Length

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build installer + portable exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Show what was built
        shell: pwsh
        run: Get-ChildItem dist -Filter *.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      # The .exe files also go on the repository's Releases page: a normal download link, no Artifacts section needed.
      - name: Publish a GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem dist -Filter *.exe | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw 'No .exe files were produced in dist/' }
          $tag = "build-${{ github.run_number }}"
          gh release create $tag @files --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Prism build ${{ github.run_number }}" --notes "Prism for Windows. Download Prism-portable (no install) or Prism-Setup (installer). SmartScreen may warn because the app is not code-signed: More info > Run anyway."

      # Backup copy as a workflow artifact too
      - name: Upload Prism (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Prism-windows
          path: dist/*.exe
          if-no-files-found: error
